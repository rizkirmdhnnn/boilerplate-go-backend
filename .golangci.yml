# golangci-lint configuration v1
# https://golangci-lint.run/usage/configuration/

run:
  go: "1.25"
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
