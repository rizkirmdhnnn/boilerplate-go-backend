apiVersion: apps/v1
kind: Deployment
metadata:
  name: boilerplate-api
  namespace: boilerplate
  labels:
    app.kubernetes.io/name: boilerplate
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: boilerplate-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: boilerplate
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boilerplate
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets: []
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/rizkirmdhnnn/boilerplate-go-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: boilerplate-config
            - secretRef:
                name: boilerplate-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 30
      restartPolicy: Always
