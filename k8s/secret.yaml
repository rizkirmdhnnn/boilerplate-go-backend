# =============================================================================
# Secret Template — DO NOT commit with real values!
# =============================================================================
# Apply with:
#   kubectl create secret generic boilerplate-secret \
#     --namespace boilerplate \
#     --from-literal=DB_PASSWORD='<your-password>' \
#     --from-literal=JWT_SECRET='<your-jwt-secret>' \
#     --from-literal=REDIS_PASSWORD='<your-redis-password>'
#
# Or use SealedSecrets / External Secrets for GitOps:
#   https://github.com/bitnami-labs/sealed-secrets
#   https://external-secrets.io
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: boilerplate-secret
  namespace: boilerplate
  labels:
    app.kubernetes.io/name: boilerplate
    app.kubernetes.io/part-of: boilerplate-backend
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  JWT_SECRET: "change-me-to-a-secure-random-string"
  REDIS_PASSWORD: ""
