apiVersion: v1
kind: ConfigMap
metadata:
  name: boilerplate-config
  namespace: boilerplate
  labels:
    app.kubernetes.io/name: boilerplate
    app.kubernetes.io/part-of: boilerplate-backend
data:
  APP_NAME: "boilerplate"
  APP_VERSION: "1.0.0"
  ENV: "production"
  DEBUG: "false"

  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  READ_TIMEOUT: "10s"
  WRITE_TIMEOUT: "30s"
  SHUTDOWN_TIMEOUT: "10s"

  DB_HOST: "boilerplate-postgres"
  DB_PORT: "5432"
  DB_USER: "boilerplate"
  DB_NAME: "boilerplate"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "5"
  DB_CONN_MAX_LIFETIME: "5m"

  JWT_EXPIRATION: "24h"
  CORS_ALLOWED_ORIGINS: "*"

  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MIN: "100"
  RATE_LIMIT_BURST: "20"

  REDIS_ENABLED: "true"
  REDIS_HOST: "boilerplate-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  LOG_LEVEL: "info"
  LOG_JSON: "true"
